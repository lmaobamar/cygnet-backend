services:
  dragonfly:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly"
    container_name: cygnet-dragonfly
    restart: always
    # ports:
    #   - "6379:6379"
    network_mode: "host"
    volumes:
      - ./.containers/dragonfly:/data

  postgres:
    image: postgres:18-alpine
    container_name: cygnet-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cygnet
    ports:
      - "5432:5432"
    volumes:
      - ./.containers/postgres:/var/lib/postgresql
